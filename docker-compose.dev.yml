version: '3.9'

# Development override — mounts source and enables hot reload
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: deps
    command: npm run dev
    volumes:
      - ./backend/src:/app/src
      - ./backend/next.config.js:/app/next.config.js
    environment:
      NODE_ENV: development
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps
    command: npm run dev
    volumes:
      - ./frontend/src:/app/src
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
