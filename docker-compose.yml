version: '3.9'

services:
  # ── Backend API ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-receptionist-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      # LLM Keys — override in .env or environment
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-deepseek}
      # Security
      API_SECRET_KEY: ${API_SECRET_KEY:-changeme_replace_in_production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # RAG
      VECTOR_DB_PATH: /app/data/vectordb
      KNOWLEDGE_BASE_PATH: /app/data/knowledge
      # Rate limiting
      RATE_LIMIT_POINTS: ${RATE_LIMIT_POINTS:-30}
      RATE_LIMIT_DURATION: ${RATE_LIMIT_DURATION:-60}
    volumes:
      - vector_data:/app/data
    networks:
      - receptionist-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: '1.0'
        reservations:
          memory: 512M

  # ── Frontend UI ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_API_KEY: ${API_SECRET_KEY:-changeme_replace_in_production}
    container_name: ai-receptionist-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - receptionist-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M

volumes:
  vector_data:
    driver: local

networks:
  receptionist-net:
    driver: bridge
