version: '3.9'

# ═══════════════════════════════════════════════════════════════════
# REQUIRED before first run:
#   cp .env.example .env
#   # Set these in .env (or export as shell env vars):
#   JWT_ACCESS_SECRET=<openssl rand -hex 32>
#   JWT_REFRESH_SECRET=<openssl rand -hex 32>
#   ADMIN_PASSWORD=<strong password, min 12 chars>
#   At least one of: DEEPSEEK_API_KEY / ANTHROPIC_API_KEY / OPENAI_API_KEY
# ═══════════════════════════════════════════════════════════════════

services:
  # ── Python FastAPI Backend ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-receptionist-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      ENV: production
      PORT: "3001"
      PYTHONUNBUFFERED: "1"

      # ── LLM keys (at least one required) ──────────────────────────────
      DEEPSEEK_API_KEY:      ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY:     ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY:        ${OPENAI_API_KEY:-}
      DEFAULT_LLM_PROVIDER:  ${DEFAULT_LLM_PROVIDER:-deepseek}

      # ── JWT secrets (REQUIRED — must be set in .env) ──────────────────
      # Generate: openssl rand -hex 32
      JWT_ACCESS_SECRET:    ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set in .env}
      JWT_REFRESH_SECRET:   ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set in .env}
      JWT_ACCESS_TTL_SEC:   ${JWT_ACCESS_TTL_SEC:-900}
      JWT_REFRESH_TTL_SEC:  ${JWT_REFRESH_TTL_SEC:-604800}

      # ── Admin credentials (REQUIRED) ──────────────────────────────────
      ADMIN_USERNAME:  ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD:  ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}

      # ── Storage ───────────────────────────────────────────────────────
      VECTOR_DB_PATH:              /app/data/vectordb
      DATA_PATH:                   /app/data
      HF_HOME:                     /app/data/models
      SENTENCE_TRANSFORMERS_HOME:  /app/data/models
      TRANSFORMERS_CACHE:          /app/data/models

      # ── CORS ──────────────────────────────────────────────────────────
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

      # ── Rate limiting ─────────────────────────────────────────────────
      RATE_LIMIT_GLOBAL:  ${RATE_LIMIT_GLOBAL:-30/minute}
      RATE_LIMIT_AUTH:    ${RATE_LIMIT_AUTH:-5/minute}
      RATE_LIMIT_INGEST:  ${RATE_LIMIT_INGEST:-10/minute}

      LOG_LEVEL: ${LOG_LEVEL:-INFO}

    volumes:
      - backend_data:/app/data
    networks:
      - receptionist-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3001/api/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: '1.5'

  # ── Next.js Frontend ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    container_name: ai-receptionist-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - receptionist-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

volumes:
  backend_data:
    driver: local

networks:
  receptionist-net:
    driver: bridge
